# Backparq configuration example
# See README.md for full documentation

# Database Connection Settings
database:
  host: "localhost"
  port: 5432
  name: "my_database"
  user: "postgres"
  password: "${PG_PASSWORD}" # Use environment variable
  # sslmode: "require"  # Optional: require, verify-ca, verify-full
  # connect_timeout: 10

# S3 Storage Settings
s3:
  bucket: "my-backup-bucket"
  prefix: "db-archive"
  region: "us-east-1"
  # Credentials (can be omitted if using EC2 metadata or AWS env vars)
  access_key_id: "${AWS_ACCESS_KEY_ID}"
  secret_access_key: "${AWS_SECRET_ACCESS_KEY}"

  # Server-Side Encryption (optional)
  # sse: "aws:kms"
  # kms_key_id: "alias/my-key"

  # For S3-compatible storage (MinIO, etc.)
  # endpoint_url: "http://localhost:9000"
  # addressing_style: "path"  # path, virtual, or auto

# Parquet Settings
parquet:
  compression: "snappy" # snappy, gzip, brotli, zstd

  # Client-Side Encryption (optional - set enabled: true to use)
  encryption:
    enabled: false
    # footer_key: "base64_encoded_master_key_32_bytes"
    # key_map:
    #   "key1": "base64_encoded_wrapping_key_1"
    # column_keys:
    #   "public.billing.credit_card": "key1"

# Archive Job Settings
archive:
  # Tables to archive - supports two formats:
  # 1. Simple string (uses default primary key "id"):
  #    - public.events
  # 2. Dict with options (for custom primary keys):
  #    - table: public.orders
  #      primary_key: order_id
  tables:
    - public.events
    - table: public.audit_logs
      primary_key: log_id

  # mode: "offload" OR "backup"
  # "offload": Moves old data to S3 and optionally deletes from DB.
  #            Retention checks DATA AGE.
  # "backup":  Creates a full snapshot for Disaster Recovery.
  #            Retention checks SNAPSHOT AGE. Delete not allowed.
  mode: "offload"

  # concurrency: Number of tables to process in parallel
  concurrency: 2

  # chunk_concurrency: Number of months to process in parallel per table
  chunk_concurrency: 4

  # cutoff_exclusive: (Offload mode only)
  # Archive data OLDER than this date. Leave empty to process all data.
  cutoff_exclusive: "2025-01-01T00:00:00Z"

  # base_dir: Local directory for parquet files and manifests
  # Defaults to ./backparq-data if not specified
  base_dir: "/data/backparq"

  # perform_delete: Delete rows from DB after successful upload?
  # WARNING: Data will be permanently removed from PostgreSQL!
  perform_delete: false

  # delete_batch_size: Rows to delete per transaction (reduces lock time)
  delete_batch_size: 10000

  # Safety flags
  dry_run: true # Set to false to actually write/upload/delete
  overwrite: false # Set to true to re-archive existing chunks

  # Retention Policy (for prune command)
  retention:
    enabled: true
    # For offload mode: delete archived data older than this
    # For backup mode: delete snapshots older than this
    months: 12 # Or use 'days: 30'

# Cron Scheduling (Optional)
cron:
  enabled: false
  schedule: "0 2 * * *" # Every day at 2 AM
