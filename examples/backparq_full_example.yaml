# Backparq Full Reference Configuration
# ===================================
# This file documents all available configuration options.
# You can use environment variables for any value using ${VAR_NAME} syntax.

# 1. Database Connection
# ---------------------
database:
  host: "localhost"
  port: 5432
  name: "production_db"
  user: "postgres"
  password: "${PG_PASSWORD}"

  # SSL Mode: disable, allow, prefer, require, verify-ca, verify-full
  sslmode: "prefer"

  # Connection timeout in seconds
  connect_timeout: 10

# 2. S3 Storage Configuration
# -------------------------
s3:
  bucket: "my-company-archive-bucket"
  prefix: "postgres_data"
  region: "us-east-1"

  # Authentication (Optional if using AWS IAM Roles / ~/.aws/credentials)
  access_key_id: "${AWS_ACCESS_KEY_ID}"
  secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  session_token: "${AWS_SESSION_TOKEN}" # For temporary credentials

  # Custom Endpoint (for MinIO, R2, etc.)
  # endpoint_url: "http://minio:9000"

  # Server-Side Encryption
  # sse: "AES256"                # For SSE-S3
  # sse: "aws:kms"               # For SSE-KMS
  # kms_key_id: "alias/my-key"   # Required if sse is aws:kms

# 3. Archiving Logic
# ----------------
archive:
  # Mode:
  # - "offload": Move data older than cutoff to S3 and DELETE from DB.
  # - "backup":  Copy ALL data to S3 snapshots. No deletion.
  mode: "offload"

  # Where to store temporary parquet files before upload
  base_dir: "./backparq-data"

  # Default column to order by (usually your time partitioning column)
  order_by: "created_at"

  # Data older than this is archived (Offload mode only)
  # Supports relative (e.g., -30d, -1y) or absolute ISO8601 dates
  cutoff: "-30d"

  # Safety switch. If false, data is copied but NOT deleted from DB.
  perform_delete: true

  # Concurrency settings
  chunk_concurrency: 4 # Number of chunks (months) to process in parallel
  fetch_size: 50000 # DB cursor fetch size

  # Run VACUUM after deleting data (Warning: can be resource intensive)
  vacuum: false

  # Table Configuration
  tables:
    # Simple syntax (uses defaults)
    - public.events

    # Advanced syntax
    - table: public.audit_logs
      primary_key: log_id # Used for 'restore --conflict-mode upsert'
      order_by: timestamp # Override default order_by

      # Data Masking (Redact sensitive fields in Parquet)
      masking:
        email: "md5" # Hash the email column
        credit_card: "null" # Nullify the column

  # Retention Policy (Pruning)
  retention:
    enabled: true
    days: 365 # Keep archives/backups for 1 year

# 4. Parquet Format Settings
# ------------------------
parquet:
  compression: "zstd" # snappy, gzip, brotli, zstd, none
  row_group_size: 100000 # Rows per row group

  # Client-Side Encryption (Optional)
  encryption:
    master_key: "${PARQUET_MASTER_KEY}" # Base64 encoded 32-byte key
    footer_key: "${PARQUET_FOOTER_KEY}"
