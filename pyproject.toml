[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backparq"
version = "0.1.0"
description = "Archive Postgres tables to Parquet and upload to S3."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Backup Parquet S3" }
]
dependencies = [
  "boto3>=1.28.0",
  "psycopg2-binary>=2.9.0",
  "pyarrow>=12.0.0",
  "PyYAML>=6.0.0",
  "tenacity>=8.0.0",
  "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "testcontainers[postgres, minio]",
  "sqlalchemy",
]

[project.scripts]
backparq = "backparq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backparq"]
