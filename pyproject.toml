[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backparq"
version = "0.4.0"
description = "PostgreSQL backup and archive to Parquet on S3. Offload cold data, full snapshots, point-in-time restore."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = [
    "postgres",
    "postgresql",
    "parquet",
    "s3",
    "backup",
    "archive",
    "data-lake",
    "data-archiving",
    "etl",
    "database",
    "aws",
    "minio",
]
authors = [
    { name = "Backparq Contributors", email = "thehighestintheroom00@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.28.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "pyarrow>=12.0.0",
    "PyYAML>=6.0.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "testcontainers[postgres,minio]>=3.7.0",
    "types-PyYAML",
]
notifications = ["httpx>=0.25.0"]
all = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/hemashoe/backparq"
Documentation = "https://github.com/hemashoe/backparq#readme"
Repository = "https://github.com/hemashoe/backparq.git"
Issues = "https://github.com/hemashoe/backparq/issues"
Changelog = "https://github.com/hemashoe/backparq/blob/main/CHANGELOG.md"

[project.scripts]
backparq = "backparq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backparq"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short --ignore=src"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/backparq"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Ruff (linter) configuration
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (some files use mid-file imports)
    "B008",   # do not perform function calls in argument defaults
    "UP045",  # Optional[X] vs X | None (py39 compatibility)
    "F401",   # unused imports (re-exports)
]

[tool.ruff.lint.per-file-ignores]
# plan.py has variables for planned future use
"src/backparq/plan.py" = ["F841"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

